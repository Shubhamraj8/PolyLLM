version: "1.0.0"

routing:
  default_chain: default
  chains:
    default: [groq, gemini]
    groq_only: [groq]
    gemini_only: [gemini]
    gemini_first: [gemini, groq]

providers:
  groq:
    timeout_seconds: 10
    models: [mixtral-8x7b-32768, llama-3.1-8b-instant]
    default_model: mixtral-8x7b-32768
    base_url: "https://api.groq.com/openai/v1"
  gemini:
    timeout_seconds: 15
    models: [gemini-1.5-flash, gemini-1.5-flash-8b]
    default_model: gemini-1.5-flash
    base_url: "https://generativelanguage.googleapis.com/v1beta"

circuit_breaker:
  failure_threshold: 5
  window_seconds: 60
  cooldown_seconds: 30

rate_limit:
  per_api_key:
    requests: 100
    window_seconds: 60
  per_ip:
    requests: 50
    window_seconds: 60

retry:
  max_attempts: 3
  base_delay_seconds: 0.1
  max_delay_seconds: 5.0
  multiplier: 2.0
  jitter: true

audit:
  enabled: true
  max_entries: 10000
  ttl_days: 7

cost_tracking:
  enabled: true
